<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scate=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie-edge">
        <title>Image Grid Layout</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="grid-container">
            <img class="grid-row-span-2" src="./assets/photo-1725060555163-c1fd4f569925.avif" alt="A foggy beach with a large rock formation in the foreground" />
            <img src="./assets/premium_photo-1695582868702-5b0f91584d00.avif" alt="A table topped with plates and bowls of food" />
            <img class="grid-row-span-2"  src="./assets/photo-1724747891638-68862b7b3165.avif" alt="A row of white apartment buildings next to a street" />
            <img class="grid-item-4" src="./assets/photo-1725042893312-5ec0dea9e369.avif" alt="A living room with a white couch and a round window" />
            <img class="grid-row-span-2" src="./assets/photo-1724862830679-954d49573f3f.avif" alt="A building with a red door and a tree in front of it" />
            <img src="./assets/premium_photo-1724863374168-cc3334387b81.avif" alt="A view of a beach from the top of a hill" />
        </div>
    </body>
</html>
